name: Benchmark OSS upload endpoints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: rustdesk-release
      OSS_PREFIX: rustdesk/_speed-test
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark upload paths
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          python3 -m pip install --disable-pip-version-check oss2
          python3 - <<'PY'
          import os
          import secrets
          import time
          from pathlib import Path
          import oss2

          bucket_name = os.environ["OSS_BUCKET"]
          prefix = os.environ["OSS_PREFIX"]
          auth = oss2.Auth(
              os.environ["ALIYUN_ACCESS_KEY_ID"],
              os.environ["ALIYUN_ACCESS_KEY_SECRET"],
          )
          payload = Path("/tmp/oss-speed-test.bin")
          payload.write_bytes(secrets.token_bytes(32 * 1024 * 1024))
          run_id = os.environ["GITHUB_RUN_ID"]

          for endpoint in ("oss-cn-shanghai.aliyuncs.com", "oss-accelerate.aliyuncs.com"):
              key = f"{prefix}/{run_id}/{endpoint}.bin"
              bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name, connect_timeout=60)
              started = time.monotonic()
              bucket.put_object_from_file(key, str(payload))
              elapsed = time.monotonic() - started
              size = bucket.head_object(key).content_length
              print(f"endpoint={endpoint} bytes={size} seconds={elapsed:.3f} MiB_per_second={size / elapsed / 1024 / 1024:.2f}", flush=True)
              bucket.delete_object(key)
          payload.unlink()
          PY
