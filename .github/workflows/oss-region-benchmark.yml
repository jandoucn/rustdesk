name: Benchmark OSS regions

on:
  workflow_dispatch:
    inputs:
      keep_objects:
        description: Keep temporary objects for a follow-up download test
        required: false
        default: false
        type: boolean
      cleanup_run_id:
        description: Delete temporary objects from a previous benchmark run
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}
      KEEP_OBJECTS: ${{ inputs.keep_objects }}
      CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
      ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
    steps:
      - name: Benchmark multipart upload endpoints
        run: |
          python3 -m pip install --disable-pip-version-check oss2
          python3 - <<'PY'
          import hashlib
          import os
          import secrets
          import time
          from pathlib import Path
          import oss2

          auth = oss2.Auth(os.environ["ACCESS_KEY_ID"], os.environ["ACCESS_KEY_SECRET"])
          path = Path("/tmp/oss-region-benchmark.bin")
          path.write_bytes(secrets.token_bytes(32 * 1024 * 1024))
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          run_id = os.environ["RUN_ID"]
          cleanup_run_id = os.environ.get("CLEANUP_RUN_ID", "")
          cases = (
              ("accelerate", "rustdesk-release", "oss-accelerate.aliyuncs.com"),
              ("hongkong", "rustdesk-client-release", "oss-cn-hongkong.aliyuncs.com"),
          )
          if cleanup_run_id:
              for label, bucket_name, endpoint in cases:
                  bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name, connect_timeout=60)
                  bucket.delete_object(f"rustdesk/_speed-test/{cleanup_run_id}/{label}.bin")
                  print(f"CLEANUP endpoint={endpoint} bucket={bucket_name} run_id={cleanup_run_id}", flush=True)
              raise SystemExit(0)
          created = []
          for label, bucket_name, endpoint in cases:
              key = f"rustdesk/_speed-test/{run_id}/{label}.bin"
              bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name, connect_timeout=60)
              started = time.monotonic()
              oss2.resumable_upload(
                  bucket,
                  key,
                  str(path),
                  multipart_threshold=1 * 1024 * 1024,
                  part_size=5 * 1024 * 1024,
                  num_threads=4,
              )
              elapsed = time.monotonic() - started
              size = bucket.head_object(key).content_length
              url = f"https://{bucket_name}.{endpoint}/{key}"
              print(f"UPLOAD endpoint={endpoint} bucket={bucket_name} bytes={size} seconds={elapsed:.3f} MiB_per_second={size / elapsed / 1024 / 1024:.2f} sha256={digest} url={url}", flush=True)
              created.append((bucket, key))
          if os.environ.get("KEEP_OBJECTS", "false").lower() != "true":
              for bucket, key in created:
                  bucket.delete_object(key)
          path.unlink()
          PY
