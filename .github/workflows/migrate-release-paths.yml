name: 迁移发布目录

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-release-paths
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      OSS_BUCKET: rustdesk-release
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_PREFIX: rustdesk/stable
    steps:
      - name: 安装 OSS 客户端
        run: python3 -m pip install --disable-pip-version-check oss2

      - name: 迁移并验证发布目录
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os

          import oss2

          mappings = (
              ('20260929-01', 'v1.5.0-build-2026.09.29-01'),
              ('20260929-06', 'v1.5.0-build-2026.09.29-06'),
              ('yan-v1.5.0-build20260930.1', 'v1.5.0-build-2026.09.30-01'),
              ('yan-v1.5.0-build20260930.2', 'v1.5.0-build-2026.09.30-02'),
              ('yan-v1.5.0', 'v1.5.0-build-2026.09.30-03'),
          )
          bucket_name = os.environ['OSS_BUCKET']
          prefix = os.environ['OSS_PREFIX']
          auth = oss2.Auth(
              os.environ['ALIYUN_ACCESS_KEY_ID'],
              os.environ['ALIYUN_ACCESS_KEY_SECRET'],
          )
          bucket = oss2.Bucket(auth, f"https://{os.environ['OSS_ENDPOINT']}", bucket_name)

          for old_tag, new_tag in mappings:
              old_prefix = f'{prefix}/{old_tag}/'
              new_prefix = f'{prefix}/{new_tag}/'
              old_keys = sorted(obj.key for obj in oss2.ObjectIterator(bucket, prefix=old_prefix))
              if len(old_keys) != 9 or f'{old_prefix}catalog.json' not in old_keys:
                  raise SystemExit(f'旧目录内容异常: {old_tag}: {old_keys}')

              for old_key in old_keys:
                  if old_key.endswith('/catalog.json'):
                      continue
                  new_key = new_prefix + old_key.removeprefix(old_prefix)
                  bucket.copy_object(bucket_name, old_key, new_key)
                  old_meta = bucket.head_object(old_key)
                  new_meta = bucket.head_object(new_key)
                  if old_meta.content_length != new_meta.content_length:
                      raise SystemExit(f'复制后大小不一致: {old_key} -> {new_key}')

              catalog_key = f'{old_prefix}catalog.json'
              catalog = json.loads(bucket.get_object(catalog_key).read())
              if catalog.get('tag') != old_tag or len(catalog.get('assets', [])) != 8:
                  raise SystemExit(f'旧 catalog 异常: {old_tag}')
              catalog['tag'] = new_tag
              for asset in catalog['assets']:
                  asset['key'] = new_prefix + asset['key'].removeprefix(old_prefix)
              new_catalog_key = f'{new_prefix}catalog.json'
              bucket.put_object(
                  new_catalog_key,
                  json.dumps(catalog, ensure_ascii=False, separators=(',', ':')).encode(),
              )

              written = json.loads(bucket.get_object(new_catalog_key).read())
              new_keys = sorted(obj.key for obj in oss2.ObjectIterator(bucket, prefix=new_prefix))
              if written != catalog or len(new_keys) != 9:
                  raise SystemExit(f'新目录验证失败: {new_tag}: {new_keys}')
              for asset in written['assets']:
                  if bucket.head_object(asset['key']).content_length != asset['size']:
                      raise SystemExit(f'新资产大小错误: {asset["key"]}')

          for old_tag, _ in mappings:
              old_prefix = f'{prefix}/{old_tag}/'
              for obj in list(oss2.ObjectIterator(bucket, prefix=old_prefix)):
                  bucket.delete_object(obj.key)
              if any(True for _ in oss2.ObjectIterator(bucket, prefix=old_prefix)):
                  raise SystemExit(f'旧目录删除失败: {old_tag}')

          print(json.dumps({'migrated': len(mappings), 'assets_per_release': 8}, ensure_ascii=False))
          PY

      - name: 验证公开下载入口
        run: |
          for tag in \
            v1.5.0-build-2026.09.29-01 \
            v1.5.0-build-2026.09.29-06 \
            v1.5.0-build-2026.09.30-01 \
            v1.5.0-build-2026.09.30-02 \
            v1.5.0-build-2026.09.30-03
          do
            curl --fail --silent --show-error \
              "https://download.yan.life/${OSS_PREFIX}/${tag}/catalog.json" >/dev/null
          done
