name: Flutter Tag Build

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Build edition
        type: choice
        options:
          - standard
          - sos
        default: standard
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      edition: ${{ inputs.edition || 'sos' }}
