name: 发布构建

on:
  workflow_dispatch:
    inputs:
      standard:
        description: 构建标准版
        type: boolean
        default: true
      sos:
        description: 构建 SOS 版
        type: boolean
        default: true
      platforms:
        description: 构建平台，android 只出手机包
        type: choice
        options:
          - all
          - android
        default: all
      tag:
        description: 自定义 tag，留空按统一版本源生成
        type: string
        default: ""

concurrency:
  group: flutter-tag-release
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.date.outputs.tag }}
      release_name: ${{ steps.date.outputs.release_name }}
      version: ${{ steps.date.outputs.version }}
      build_number: ${{ steps.date.outputs.build_number }}
      build_seq: ${{ steps.date.outputs.build_seq }}
    steps:
      - uses: actions/checkout@v4
      - id: date
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          build_number=$(python3 -c 'import json; print(json.load(open("version.json"))["build_number"])')
          build_seq=$(python3 -c 'import json; print(json.load(open("version.json"))["build_seq"])')
          build_date="${build_number%%[.-]*}"
          if [[ ! "$build_date" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid build date in version.json: $build_number" >&2
            exit 1
          fi
          if [[ ! "$build_seq" =~ ^[0-9]{10}$ ]] || [[ "${build_seq:0:8}" != "$build_date" ]]; then
            echo "Invalid build_seq in version.json: $build_seq" >&2
            exit 1
          fi
          formatted_date="${build_date:0:4}.${build_date:4:2}.${build_date:6:2}"
          tag_base="v${version}-build-${formatted_date}"
          sequence_value=$((10#$build_seq % 100))
          printf -v sequence '%02d' "$sequence_value"
          expected_tag="${tag_base}-${sequence}"
          if [ "$CUSTOM_TAG" != "" ]; then
            if [ "$CUSTOM_TAG" != "$expected_tag" ]; then
              echo "Custom tag must match version.json: expected $expected_tag, got $CUSTOM_TAG" >&2
              exit 1
            fi
            tag="$CUSTOM_TAG"
          else
            tag="$expected_tag"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          release_name="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "build_seq=$build_seq" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Release name: $release_name"

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Patch Flutter 3.24.5
        shell: bash
        run: |
          flutter_root=$(dirname "$(dirname "$(command -v flutter)")")
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root/"
          git -C "$flutter_root" apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Run metadata and workflow tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Generate Flutter bridge
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Run Flutter analysis and target tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test \
            test/address_book_customization_test.dart \
            test/yan_standard_ui_policy_test.dart \
            test/verified_update_entry_test.dart

  run-flutter-tag-build:
    needs: [release-tag, preflight]
    if: inputs.standard || inputs.sos
    strategy:
      fail-fast: true
      matrix:
        edition: ${{ fromJson(format('[{0}{1}{2}]', inputs.standard && '"standard"' || '', inputs.standard && inputs.sos && ',' || '', inputs.sos && '"sos"' || '')) }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag != '' && inputs.tag || needs.release-tag.outputs.tag }}
      release-name: ${{ inputs.tag != '' && inputs.tag || needs.release-tag.outputs.release_name }}
      edition: ${{ matrix.edition }}
      platforms: ${{ inputs.platforms }}
      version: ${{ needs.release-tag.outputs.version }}
      build_number: ${{ needs.release-tag.outputs.build_number }}
      build_seq: ${{ needs.release-tag.outputs.build_seq }}
      publish_release_assets: false

  publish-release:
    needs: [release-tag, run-flutter-tag-build]
    if: inputs.standard || inputs.sos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载本轮发布产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: 校验并发布 Release
        shell: bash
        run: |
          set -euo pipefail
          editions=""
          if [ "${{ inputs.standard }}" = "true" ]; then editions="standard"; fi
          if [ "${{ inputs.sos }}" = "true" ]; then editions="${editions:+$editions,}sos"; fi
          python3 .github/scripts/validate-release-assets.py release-assets --editions "$editions"
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "" \
            --prerelease
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          expected=${#assets[@]}
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets | length')
          if [ "$actual" -ne "$expected" ]; then
            echo "Release asset count mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

  publish-oss:
    needs: [release-tag, publish-release]
    if: inputs.standard && inputs.sos && inputs.platforms == 'all'
    uses: ./.github/workflows/publish-oss.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || needs.release-tag.outputs.tag }}

  cleanup-incomplete-release:
    needs: [release-tag, run-flutter-tag-build, publish-release, publish-oss]
    if: >-
      always() &&
      needs.release-tag.result == 'success' &&
      (needs.publish-release.result == 'failure' ||
       needs.publish-release.result == 'cancelled' ||
       needs.publish-oss.result == 'failure' ||
       needs.publish-oss.result == 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || needs.release-tag.outputs.tag }}
    steps:
      - name: 删除本轮未完整发布的 Release 和 tag
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          fi
