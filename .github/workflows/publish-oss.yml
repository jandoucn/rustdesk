name: Publish release assets to Aliyun OSS

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      build_seq:
        required: true
        type: string
      android_version_code:
        required: true
        type: string
    secrets:
      ALIYUN_ACCESS_KEY_ID:
        required: true
      ALIYUN_ACCESS_KEY_SECRET:
        required: true
      UPDATE_SIGNING_KEY:
        required: true
      UPDATE_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oss-stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: rustdesk-release
      OSS_ENDPOINT: oss-accelerate.aliyuncs.com
      OSS_PREFIX: rustdesk/stable
      RELEASE_TAG: ${{ inputs.tag }}
      DOWNLOAD_BASE: https://download.yan.life
      UPDATE_PUBLISH_URL: https://rdapi.yan.life/rd/update/v1/publish
      UPDATE_MANIFEST_URL: https://rdapi.yan.life/rd/update/v1/manifest/stable.json
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 1

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

      - name: Install OSS publisher
        run: python3 -m pip install --disable-pip-version-check oss2 pynacl

      - name: 同步发布版本元数据
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            python3 .github/scripts/release-metadata.py apply \
              --metadata release-source/version.json \
              --version "${{ inputs.version }}" \
              --build-number "${{ inputs.build_number }}" \
              --build-seq "${{ inputs.build_seq }}" \
              --android-version-code "${{ inputs.android_version_code }}"
          fi

      - name: Publish assets and update manifest
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
        run: |
          python3 .github/scripts/publish-release-to-oss.py \
            --assets-dir release-assets \
            --source-dir release-source \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --bucket "$OSS_BUCKET" \
            --endpoint "$OSS_ENDPOINT" \
            --prefix "$OSS_PREFIX" \
            --download-base "$DOWNLOAD_BASE" \
            --publish-url "$UPDATE_PUBLISH_URL" \
            --stable-manifest-url "$UPDATE_MANIFEST_URL"
